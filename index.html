<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X.Door.id — Preview Environment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box}
    body{background:#0d0d12;color:#fff}
    .neon-glow{box-shadow:0 0 50px -10px rgba(124,58,237,0.5)}
    .glass{background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08)}
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-xl w-full text-center">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs font-bold mb-6 neon-glow">
      <span>🚀 Preview Sandbox Active</span>
    </div>
    <h1 class="text-4xl sm:text-5xl font-black tracking-tight mb-4 bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">
      x.door.id Preview
    </h1>
    <p class="text-gray-400 text-sm sm:text-base mb-8 leading-relaxed">
      Subdomain ini adalah area uji coba aman (sandbox) untuk menguji fitur, desain, dan integrasi baru sebelum dipublish ke <code class="text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded">door.id</code> utama.
    </p>

    <div class="glass p-6 rounded-2xl text-left space-y-4 mb-8">
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <span class="text-xs text-gray-400 font-semibold">Environment</span>
        <span class="text-xs font-bold text-green-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Cloudflare Pages</span>
      </div>
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <span class="text-xs text-gray-400 font-semibold">Preview Domain</span>
        <span class="text-xs font-mono text-purple-300">x.door.id</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-gray-400 font-semibold">Status</span>
        <span class="text-xs font-bold text-yellow-400">Siap Menerima Deploy Preview</span>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button onclick="alert('Sandbox berfungsi! Deploy fitur baru ke branch preview untuk tes di sini.')" class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-purple-600/30 hover:opacity-95 transition">
        ✨ Tes Interaksi
      </button>
      <a href="https://door.id" class="px-6 py-3 rounded-xl bg-white/5 border border-white/10 text-gray-300 font-bold text-sm hover:bg-white/10 transition">
        ← Kembali ke door.id
      </a>
    </div>
  </div>
</body>
</html>
